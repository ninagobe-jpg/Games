function mkCat(C,D2){const g=new THREE.Group();
sp(.35,C,0,.38,0,g,1.3,.9,1);sp(.26,C,0,.72,.36,g);bx(.5,.04,.14,D2,0,.64,0,g);bx(.1,.1,.6,C,0,.52,-.58,g);
[-.14,.14].forEach(x=>{const e=new THREE.Mesh(new THREE.ConeGeometry(.09,.2,4),M(C));e.position.set(x,.98,.36);g.add(e);sp(.035,0x111118,x*.8,.76,.58,g)});
sp(.04,0xff8fa0,0,.7,.61,g);return g}
function tag(txt){const k=document.createElement('canvas');k.width=128;k.height=40;const x=k.getContext('2d');x.fillStyle='rgba(29,27,58,.85)';x.fillRect(0,0,128,40);x.fillStyle='#fff4e0';x.font='bold 24px sans-serif';x.textAlign='center';x.fillText(txt,64,28);
const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(k)}));s.scale.set(1.3,.4,1);s.position.set(0,1.6,0);return s}
const cats=[mkCat(0xff9a3c,0xe07a1e),mkCat(0x8d98a8,0x5d6676)];
cats[0].add(tag('Nishi'));cats[1].add(tag('Noya'));
cats.forEach((c,i)=>{c.position.set(i?-1.7:1.7,.15,.9);sc.add(c)});
/* intro */
function lt(n){LT.forEach((l,i)=>l.material.color.setHex(i<n?0xff2a2a:0x401010))}
lt(0);
const IT=[[.3,'Dicen que la vida es una carrera…'],[3.2,'Javi prefiere apostar por todos los caminos.'],[6,'<b>JAVI GP</b>Una carrera. Muchas decisiones.']],LTM=[7,7.6,8.2,8.8,9.4];
function beep(f,d){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function introStep(){const I=intro,tx=$('#itx');
while(I.i<IT.length&&I.t>=IT[I.i][0]){tx.innerHTML=IT[I.i][1];tx.classList.add('on');if(I.i<2)setTimeout(()=>tx.classList.remove('on'),2300);I.i++}
while(I.l<LTM.length&&I.t>=LTM[I.l]){I.l++;lt(I.l);beep(440,.2)}
if(!I.go&&I.t>=10.6){I.go=1;lt(0);beep(880,.7);tx.innerHTML='<b>¡YA!</b>';tx.classList.add('on')}
if(I.t>=12){endIntro();return}
const k=Math.min(I.t/8,1),e=k*k*(3-2*k);
cam.position.set(9*(1-e),11-4.5*e,(END+16)*(1-e)+9*e);look.set(0,3-2*e,END*(1-e)-5*e);cam.lookAt(look)}
function endIntro(){intro=null;$('#cin').hidden=true;$('#itx').classList.remove('on');lt(0);start()}
const clock=new THREE.Clock(),look=new THREE.Vector3(0,1,-5);
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
if(mv){pw.rotation.y=Math.PI;mv.t+=dt*3.4;const k=Math.min(mv.t,1);pw.position.lerpVectors(mv.a,mv.b,k);pw.position.y+=Math.sin(k*Math.PI)*.9;if(k>=1){const c=mv.cb;mv=null;c()}}
else pw.rotation.y=Math.PI+Math.sin(t*1.6)*.12;
const p=pw.position;if(intro){intro.t+=dt;introStep()}else{cam.position.lerp(new THREE.Vector3(p.x*.5,6.5,p.z+9),.06);look.lerp(new THREE.Vector3(p.x,1,p.z-5),.08);cam.lookAt(look)}
cats.forEach((c,i)=>{c.position.lerp(new THREE.Vector3(p.x+(i?-1.7:1.7),.15,p.z+.5+i*.4),.05);c.rotation.y=Math.PI+Math.sin(t*2+i)*.25});
R.render(sc,cam)}
tick();
const hop=(a,b,cb)=>{mv={a:P(a),b:P(b),t:0,cb}};

/* juego */
function hud(){const v=Math.max(0,S.v);$('#hud').innerHTML=`<span class=chip>Casilla ${pos}/${T}</span><span class=chip>${LV[st()]}</span><span class=chip>💶 ${S.d}</span><span class=chip>😄 ${S.a}/100</span><span class=chip>⚡ ${S.e}/100</span><span class=chip>🃏 ${S.c}</span><span class=chip>🍦 ${S.m}</span><span class=chip>${'❤️'.repeat(v)}${'🖤'.repeat(5-v)}</span>`}
function card(h){$('#ov').innerHTML='<div class="card">'+h+'</div>';$('#ov').hidden=false}
function close(){$('#ov').hidden=true;busy=false;$('#roll').disabled=false}
function home(){card(`<h1>Javi GP</h1><p class=sub>Una carrera. Muchas decisiones.</p><p>Tira el dado, avanza por el circuito y toma decisiones que afectan a tu dinero, ánimo y energía. Cada partida puede terminar en un final distinto.</p><button class="btn" id=pl>Jugar</button><button class="btn sec" id=un>Mis finales (${seen.size}/12)</button>`);$('#pl').onclick=play;$('#un').onclick=uni}
function uni(){card(`<h2>Mis finales (${seen.size}/12)</h2>`+E.map((e,i)=>seen.has(i)?`<div class=u><i>${e[2]}</i><div><b>${e[0]}</b><span>${e[1]}</span></div></div>`:`<div class=u><i>🔒</i><div><b>???</b><span>Aún no descubierto.</span></div></div>`).join('')+`<button class="btn" id=bk>Volver</button>`);$('#bk').onclick=home}
function start(){S={d:500,a:60,e:60,c:0,v:5,m:0};pos=0;mv=null;decks=EV.map(g=>g.slice().sort(()=>Math.random()-.5));pw.position.copy(P(0));cats.forEach((c,i)=>c.position.set(i?-1.7:1.7,.15,.9));$('#dice').classList.remove('go');$('#dice').style.transform='rotateX(-28deg) rotateY(38deg)';rx=-28;ry=38;hud();$('#hud').hidden=false;$('#dock').hidden=false;close()}
$('#roll').onclick=()=>{if(busy)return;busy=true;$('#roll').disabled=true;
const r=1+Math.floor(Math.random()*6),m={1:[0,0],6:[0,180],2:[0,-90],5:[0,90],3:[-90,0],4:[90,0]}[r];
rx=rx-(((rx%360)+360)%360)+720+m[0];ry=ry-(((ry%360)+360)%360)+1080+m[1];
const d=$('#dice'),w=$('#dw');d.classList.add('go');d.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;
w.classList.remove('hp');void w.offsetWidth;w.classList.add('hp');beep(300,.08);
setTimeout(()=>go(r),1500)};
(function(){const PP={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};let h='';
for(let n=1;n<=6;n++){h+=`<div class="fc f${n}" data-n="${n}">`;for(let c=0;c<9;c++)h+=PP[n].includes(c)?'<i></i>':'<u></u>';h+='</div>'}$('#dice').innerHTML=h})();
$('#skip').onclick=()=>{if(intro)endIntro()};
function play(){if(seenIntro)return start();seenIntro=true;try{AC=new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
$('#ov').hidden=true;$('#cin').hidden=false;pw.position.copy(P(0));intro={t:0,i:0,l:0,go:0}}
function go(r){if(r<=0||pos>=T)return land();hop(pos,pos+1,()=>{pos++;hud();go(r-1)})}
function land(){if(pos>=T)return fin();const ev=decks[st()].pop();
if(!ev){S.a=Math.min(100,S.a+5);hud();card(`<h2>Casilla tranquila</h2><p>Un respiro entre eventos.</p><div class=fx><span>+5 Ánimo</span></div><button class="btn" id=ok>Seguir</button>`);$('#ok').onclick=close;return}
card(`<h2>${ev[0]}</h2><p class=lv>${LV[st()]}, casilla ${pos}</p><p>${ev[1]}</p>`+ev[2].map((o,i)=>`<button class=opt data-i="${i}"><b>${'ABC'[i]}. ${o[0]}</b><span>${o[1]}</span></button>`).join(''));
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(ev[2][+b.dataset.i]))}
function pick(o){let f=o[2];if(Array.isArray(f))f=f[Math.random()<.5?0:1];const out=[];
for(const k in f){S[k]+=f[k];out.push(`<span>${f[k]>0?'+':''}${f[k]} ${L[k]}</span>`)}
S.a=Math.min(100,S.a);S.e=Math.min(100,S.e);S.d=Math.max(0,S.d);S.c=Math.max(0,S.c);S.m=Math.max(0,S.m);S.v=Math.min(5,S.v);
let note='';if(S.a<=0||S.e<=0){S.v--;if(S.a<=0)S.a=40;if(S.e<=0)S.e=40;note='<p class=warn>¡Colapso! Pierdes 1 vida y recuperas fuerzas.</p>'}
hud();card(`<h2>${o[0]}</h2><p>${o[1]}</p><div class=fx>${out.join('')}</div>${note}<button class="btn" id=ok>Seguir</button>`);
$('#ok').onclick=()=>S.v<=0?fin():close()}
function pickEnd(){if(S.v<=0)return 0;if(S.c>=7)return 1;if(S.m>=5)return 2;if(S.d>=1200)return 3;if(S.a>=85)return 4;if(S.e>=85)return 5;if(S.c>=4)return 6;if(S.a>=65&&S.d>=400)return 7;if(S.d<=100)return 8;if(S.a<=25)return 9;if(S.e<=25)return 10;return 11}
function fin(){const i=pickEnd(),e=E[i];seen.add(i);try{localStorage.setItem('mvj',JSON.stringify([...seen]))}catch(x){}
$('#hud').hidden=true;$('#dock').hidden=true;
card(`<div class=em>${e[2]}</div><h2>${e[0]}</h2><p>${e[1]}</p><p class=lv>Final ${i+1} de 12. Finales descubiertos: ${seen.size}/12.</p><button class="btn" id=ag>Jugar otra vez</button><button class="btn sec" id=un>Mis finales</button>`);
$('#ag').onclick=start;$('#un').onclick=uni}
S={d:500,a:60,e:60,c:0,v:5,m:0};home();
</script></body></html>
