<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Las Mil Vidas de Javi</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#2b2358;--card:#1d1b3a;--ink:#fff4e0;--mut:#b9b2e0;--or:#ff8a3d;--tl:#2fd6c4;--pk:#ff5d8f;--line:#4b4590;color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:500 16px/1.4 "Baloo 2",ui-rounded,system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;background:rgba(29,27,58,.9);backdrop-filter:blur(8px)}
.chip{background:#2b2766;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-weight:700;font-size:14px;white-space:nowrap}
.dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;align-items:center;gap:6px}
#dice{font-size:54px;font-weight:800;height:64px;line-height:64px;color:var(--or);text-shadow:0 3px 0 #1d1b3a}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:12px 18px;margin-top:10px;background:var(--or);color:#1d1b3a;font:800 18px "Baloo 2",system-ui,sans-serif;cursor:pointer}
.btn.sec{background:#2b2766;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.dock .btn{width:auto;padding:14px 36px;font-size:22px;margin:0}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(20,16,50,.62)}
.card{width:100%;max-width:520px;max-height:86vh;overflow-y:auto;background:var(--card);border:2px solid var(--or);border-radius:22px;padding:20px}
h1{font-size:34px;line-height:1.05;font-weight:800;color:var(--or)}
h2{font-size:26px;line-height:1.1;font-weight:800;margin-bottom:6px}
.sub{color:var(--tl);font-weight:700;margin:6px 0 10px}
.lv{color:var(--mut);font-size:14px;margin-bottom:8px}
.em{font-size:56px;line-height:1}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:#2b2766;color:var(--ink);font:inherit;cursor:pointer}
.opt b{display:block;font-size:17px}
.opt span{color:var(--mut);font-size:14px}
.opt:hover,.opt:focus-visible{border-color:var(--tl)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--tl);outline-offset:2px}
.fx{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.fx span{background:#2b2766;border:1px solid var(--tl);border-radius:999px;padding:1px 10px;font-weight:700}
.warn{color:var(--pk);font-weight:700}
.u{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.u i{font-style:normal;font-size:26px}
.u span{display:block;color:var(--mut);font-size:14px}
</style></head><body>

['Casa más grande','Los gatos miran con desprecio el rascador viejo.',[['Torre de gatos','Un rascador de lujo.',{d:-200,a:25}],['Rascadores caseros','Cartón y esfuerzo.',{d:-30,a:10,e:-10}],['No hacer nada','Los gatos toman nota.',{a:-15}]]],

['Recta final','La meta está a pocas casillas.',[['Todo o nada','Mucho en juego.',[{d:300,a:20},{d:-300,e:-30}]],['Ir tranquilo','Sin prisa, con estilo.',{a:10,e:10}],['Brindar con un Monster','Como en el podio.',{e:25,a:10,d:-5}]]]
]];

let seen=new Set();try{seen=new Set(JSON.parse(localStorage.getItem('mvj')||'[]'))}catch(e){}
let S,decks,pos=0,busy=false,mv=null;
const st=()=>pos<=7?0:pos<=14?1:2;

/* 3D */
const R=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));

const mc={},M=c=>mc[c]||(mc[c]=new THREE.MeshLambertMaterial({color:c})),BM=c=>new THREE.MeshBasicMaterial({color:c});
const bx=(w,h,d,c,x,y,z,p)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);p.add(m);return m};
const sp=(r,c,x,y,z,p,sx=1,sy=1,sz=1)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),M(c));m.position.set(x,y,z);m.scale.set(sx,sy,sz);p.add(m);return m};
const cy=(r,h,c,x,y,z,p,rz)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,14),M(c));m.rotation.z=rz||0;m.position.set(x,y,z);p.add(m);return m};
const D=3.4,END=-T*D,P=i=>new THREE.Vector3(0,.15,-i*D);
const Z0=8,Z1=END-30,LL=Z0-Z1,ZC=(Z0+Z1)/2;

bx(9,.1,LL,0x3b3b48,0,0,ZC,sc);
for(let z=Z0;z>Z1;z-=1.2){const c=Math.round(z/1.2)%2?0xe23b3b:0xffffff;bx(.6,.12,1.2,c,-4.8,.02,z,sc);bx(.6,.12,1.2,c,4.8,.02,z,sc)}
[-6.1,6.1].forEach(x=>{bx(.5,1,LL,0xdfe8f0,x,.5,ZC,sc);bx(.52,.2,LL,0x2f6fe0,x,.75,ZC,sc)});
const TC=[0xff8a3d,0x2fd6c4,0xff5d8f,0xffd23f];
for(let i=0;i<T;i++)bx(2.8,.14,2.8,i==0?0x9be564:TC[i%4],0,.07,-i*D,sc);

bx(.4,5,.4,0x30303c,-5.2,2.5,2.4,sc);bx(.4,5,.4,0x30303c,5.2,2.5,2.4,sc);bx(10.8,.8,.5,0x30303c,0,5,2.4,sc);

[-1,1].forEach(s=>{cy(.4,.45,0x15151a,s*.95,.4,-1.4,g,Math.PI/2);cy(.45,.55,0x15151a,s*.95,.45,1.2,g,Math.PI/2)});

bx(4,.08,34,0x55555f,-9,0,-18,sc);
[0xe23b3b,0x2f6fe0,0x2fd6c4,0xff8a3d].forEach((c,i)=>{const z=-6-i*8;car(c,-9,z);bx(3.4,2.6,3.6,0xcfd6e0,-13.5,1.3,z,sc);bx(3.6,.3,3.8,c,-13.5,2.75,z,sc);bx(.1,1.8,2.4,0x2a2a35,-11.78,.9,z,sc)});

[-.14,.14].forEach(x=>{const e=new THREE.Mesh(new THREE.ConeGeometry(.09,.2,4),M(OR));e.position.set(x,.98,.36);cat.add(e);sp(.035,0x111118,x*.8,.76,.58,cat)});

const clock=new THREE.Clock(),look=new THREE.Vector3(0,1,-5);
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
if(mv){mv.t+=dt*3.4;const k=Math.min(mv.t,1);pw.position.lerpVectors(mv.a,mv.b,k);pw.position.y+=Math.sin(k*Math.PI)*.9;if(k>=1){const c=mv.cb;mv=null;c()}}

const p=pw.position;cam.position.lerp(new THREE.Vector3(p.x*.5,6.5,p.z+9),.06);look.lerp(new THREE.Vector3(p.x,1,p.z-5),.08);cam.lookAt(look);

tick();
const hop=(a,b,cb)=>{mv={a:P(a),b:P(b),t:0,cb}};

/* juego */
function hud(){const v=Math.max(0,S.v);$('#hud').innerHTML=`<span class=chip>Casilla ${pos}/${T}</span><span class=chip>${LV[st()]}</span><span class=chip>💶 ${S.d}</span><span class=chip>😄 ${S.a}/100</span><span class=chip>⚡ ${S.e}/100</span><span class=chip>🃏 ${S.c}</span><span class=chip>${'❤️'.repeat(v)}${'🖤'.repeat(5-v)}</span>`}
function card(h){$('#ov').innerHTML='<div class="card">'+h+'</div>';$('#ov').hidden=false}
function close(){$('#ov').hidden=true;busy=false;$('#roll').disabled=false}
function home(){card(`<h1>Las Mil Vidas de Javi</h1><p class=sub>Un Javi. Diez destinos posibles.</p><p>Tira el dado y elige entre cartas, motos, streamers y cinco gatos exigentes. ¿En qué universo acabará esta vez?</p><button class="btn" id=pl>Jugar</button><button class="btn sec" id=un>Mis universos (${seen.size}/10)</button>`);$('#pl').onclick=start;$('#un').onclick=uni}
function uni(){card(`<h2>Mis universos (${seen.size}/10)</h2>`+E.map((e,i)=>seen.has(i)?`<div class=u><i>${e[2]}</i><div><b>${e[0]}</b><span>${e[1]}</span></div></div>`:`<div class=u><i>🔒</i><div><b>???</b><span>Aún no descubierto.</span></div></div>`).join('')+`<button class="btn" id=bk>Volver</button>`);$('#bk').onclick=home}
function start(){S={d:500,a:60,e:60,c:0,v:5};pos=0;mv=null;decks=EV.map(g=>g.slice().sort(()=>Math.random()-.5));pw.position.copy(P(0));cat.position.set(1.6,.15,.9);$('#dice').textContent='';hud();$('#hud').hidden=false;$('#dock').hidden=false;close()}
$('#roll').onclick=()=>{if(busy)return;busy=true;$('#roll').disabled=true;let n=0;const iv=setInterval(()=>{$('#dice').textContent=1+Math.floor(Math.random()*6);if(++n>9){clearInterval(iv);const r=1+Math.floor(Math.random()*6);$('#dice').textContent=r;setTimeout(()=>go(r),300)}},70)};
function go(r){if(r<=0||pos>=T)return land();hop(pos,pos+1,()=>{pos++;hud();go(r-1)})}
function land(){if(pos>=T)return fin();const ev=decks[st()].pop();
if(!ev){S.a=Math.min(100,S.a+5);hud();card(`<h2>Casilla tranquila</h2><p>Un respiro entre eventos.</p><div class=fx><span>+5 Ánimo</span></div><button class="btn" id=ok>Seguir</button>`);$('#ok').onclick=close;return}
card(`<h2>${ev[0]}</h2><p class=lv>${LV[st()]}, casilla ${pos}</p><p>${ev[1]}</p>`+ev[2].map((o,i)=>`<button class=opt data-i="${i}"><b>${'ABC'[i]}. ${o[0]}</b><span>${o[1]}</span></button>`).join(''));
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(ev[2][+b.dataset.i]))}
function pick(o){let f=o[2];if(Array.isArray(f))f=f[Math.random()<.5?0:1];const out=[];
for(const k in f){S[k]+=f[k];out.push(`<span>${f[k]>0?'+':''}${f[k]} ${L[k]}</span>`)}
S.a=Math.min(100,S.a);S.e=Math.min(100,S.e);S.d=Math.max(0,S.d);S.c=Math.max(0,S.c);S.v=Math.min(5,S.v);
let note='';if(S.a<=0||S.e<=0){S.v--;if(S.a<=0)S.a=40;if(S.e<=0)S.e=40;note='<p class=warn>¡Colapso! Pierdes 1 vida y recuperas fuerzas.</p>'}
hud();card(`<h2>${o[0]}</h2><p>${o[1]}</p><div class=fx>${out.join('')}</div>${note}<button class="btn" id=ok>Seguir</button>`);
$('#ok').onclick=()=>S.v<=0?fin():close()}
function pickEnd(){if(S.v<=0)return 0;if(S.c>=7)return 1;if(S.d>=1200)return 2;if(S.a>=85)return 3;if(S.e>=85)return 4;if(S.c>=4)return 5;if(S.d<=100)return 6;if(S.a<=25)return 7;if(S.e<=25)return 8;return 9}
function fin(){const i=pickEnd(),e=E[i];seen.add(i);try{localStorage.setItem('mvj',JSON.stringify([...seen]))}catch(x){}
$('#hud').hidden=true;$('#dock').hidden=true;
card(`<div class=em>${e[2]}</div><h2>${e[0]}</h2><p>${e[1]}</p><p class=lv>Final ${i+1} de 10. Universos descubiertos: ${seen.size}/10.</p><button class="btn" id=ag>Jugar otra vez</button><button class="btn sec" id=un>Mis universos</button>`);
$('#ag').onclick=start;$('#un').onclick=uni}
S={d:500,a:60,e:60,c:0,v:5};home();
</script></body></html>
